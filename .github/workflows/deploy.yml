name: Deploy to GitHub Pages

# いつ動かすか
on:
  # main ブランチに push されたとき
  push:
    branches: [main]
  # Actions の画面から手動でも実行できるようにする
  workflow_dispatch:

# このワークフローに与える権限。まずは読み取りだけにして、必要なジョブでだけ増やす
permissions:
  contents: read

# デプロイが重なったときは、実行中のものを止めずに順番に行う
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1. サイトをビルドして、成果物として保存する
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v7

      - name: Node.js を用意
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: ビルド
        run: npm run build
        env:
          # ページの下部に表示するコミットID
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: ビルド結果を Pages 用の成果物として保存
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # 2. 保存した成果物を GitHub Pages に公開する
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 公開に必要な権限は、このジョブにだけ与える
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@v5
